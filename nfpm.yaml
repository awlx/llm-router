name: llm-router
arch: "${GOARCH}"
platform: linux
version: "${VERSION}"
section: net
priority: optional
maintainer: "awlx <6527744+awlx@users.noreply.github.com>"
description: "Router for OpenAI-compatible model servers. It routes each request by exact model ID."
vendor: "awlx"
homepage: "https://github.com/awlx/llm-router"
license: "MIT"

contents:
  - src: ./llm-router
    dst: /usr/bin/llm-router
    file_info:
      mode: 0755

  - src: ./packaging/llm-router.service
    dst: /lib/systemd/system/llm-router.service
    file_info:
      mode: 0644

  - src: ./config.example.json
    dst: /usr/share/llm-router/config.example.json
    file_info:
      mode: 0644

  - src: ./config.example.json
    dst: /etc/llm-router/config.json
    type: config|noreplace
    file_info:
      mode: 0644

  - src: ./LICENSE
    dst: /usr/share/doc/llm-router/copyright
    file_info:
      mode: 0644

scripts:
  preinstall: ./packaging/preinstall.sh
  postinstall: ./packaging/postinstall.sh
  preremove: ./packaging/preremove.sh
  postremove: ./packaging/postremove.sh
